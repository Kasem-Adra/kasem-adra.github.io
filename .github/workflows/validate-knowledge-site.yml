name: Validate multilingual site and Google entity structure

on:
  pull_request:
    branches: [main]
    paths:
      - "build.py"
      - "knowledge.py"
      - "article_render.py"
      - "results.py"
      - "results.json"
      - "_posts/**"
      - "_publications/**"
      - "dist/style.css"
      - "tests/**"
      - ".github/workflows/validate-knowledge-site.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build indexable multilingual site
        env:
          SITE_PUBLIC: "1"
        run: python3 build.py
      - name: Validate HTML, SEO metadata, internal links and structured data
        run: python3 tests/validate_site.py
      - name: Upload static review preview (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: kasem-adra-knowledge-archive-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
