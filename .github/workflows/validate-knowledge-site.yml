name: Validate knowledge archive and Google entity structure

on:
  pull_request:
    branches: [main]
    paths:
      - "build.py"
      - "knowledge.py"
      - "article_render.py"
      - "results.py"
      - "results.json"
      - "_posts/**"
      - "_publications/**"
      - "dist/style.css"
      - ".github/workflows/validate-knowledge-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build indexable multilingual site
        env:
          SITE_PUBLIC: "1"
        run: python3 build.py
      - name: Validate archive, identity graph, metadata and sitemap
        run: |
          python3 - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path("dist")
          langs = ("en", "ar", "fr")
          ns = {
              "sm": "http://www.sitemaps.org/schemas/sitemap/0.9",
              "xhtml": "http://www.w3.org/1999/xhtml"
          }

          def page(lang, route):
              return (root / lang / route.strip("/") / "index.html") if route != "/" else (root / lang / "index.html")

          def schemas(html):
              scripts = re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
              values = [json.loads(s) for s in scripts]
              return [node for value in values for node in value.get("@graph", [])]

          home = (root / "index.html").read_text(encoding="utf-8")
          home_graph = schemas(home)
          assert any(x.get("@type") == "WebSite" and x.get("name") == "Kasem Adra" for x in home_graph), "Missing root WebSite entity"
          person = next(x for x in home_graph if x.get("@type") == "Person" and x.get("@id") == "https://kasemadra.com/#person")
          assert "https://orcid.org/0009-0004-7615-4978" in person["sameAs"]
          assert "https://github.com/Kasem-Adra" in person["sameAs"]
          assert "https://www.linkedin.com/in/kasem-adra/" in person["sameAs"]
          assert "قاسم عدرا" in person["alternateName"]

          for lang in langs:
              about = page(lang, "/about/").read_text(encoding="utf-8")
              about_graph = schemas(about)
              assert any(x.get("@type") == "ProfilePage" and x.get("mainEntity", {}).get("@id") == person["@id"] for x in about_graph), f"Missing ProfilePage schema: {lang}"
              assert "profile-identifiers" in about and "LinkedIn" in about
              for section_id in ("profile-facts", "biography", "research-profile", "projects-profile", "writing-profile", "archive-profile", "identifiers"):
                  assert f'id="{section_id}"' in about, f"Missing encyclopedic profile section {section_id}: {lang}"
              assert 'class="profile-toc"' in about and 'class="profile-infobox"' in about
              assert 'rel="canonical"' in about and f'hreflang="{lang}"' in about
              assert 'name="robots" content="noindex"' not in about

              archive = page(lang, "/archive/").read_text(encoding="utf-8")
              archive_graph = schemas(archive)
              assert any(x.get("@type") == "CollectionPage" for x in archive_graph), f"Missing archive CollectionPage: {lang}"
              assert f"/{lang}/archive/baniyas-revolution-2010-2025/" in archive

              banyias = page(lang, "/archive/baniyas-revolution-2010-2025/").read_text(encoding="utf-8")
              b_graph = schemas(banyias)
              article_node = next(x for x in b_graph if x.get("@type") == "Article")
              assert article_node.get("author", {}).get("@id") == person["@id"], f"Missing archive author: {lang}"
              assert article_node.get("about", {}).get("@id") == "https://kasemadra.com/#place-baniyas", f"Missing Baniyas place entity: {lang}"
              assert len(article_node.get("citation", [])) == 26, f"Expected 26 structured citations: {lang}"
              assert any(x.get("@type") == "City" and x.get("@id") == "https://kasemadra.com/#place-baniyas" for x in b_graph), f"Missing Baniyas City entity: {lang}"
              assert banyias.count('class="timeline-entry"') == 20, f"Expected 20 chronology entries: {lang}"
              toc_targets = set(re.findall(r'href="#(overview|method|timeline|references|related)"', banyias))
              section_ids = set(re.findall(r'<section id="(overview|method|timeline|references|related)"', banyias))
              assert toc_targets == section_ids == {"overview","method","timeline","references","related"}, f"Broken archive table of contents: {lang}"
              assert len(re.findall(r'<li id="ref-\d+">', banyias)) == 26, f"Expected 26 references including local source: {lang}"
              assert banyias.count('class="citation"') >= 20, f"Missing inline source citations: {lang}"
              event_7 = re.search(r'<article class="timeline-entry" id="event-7">(.*?)</article>', banyias, re.S).group(1)
              event_13 = re.search(r'<article class="timeline-entry" id="event-13">(.*?)</article>', banyias, re.S).group(1)
              assert 'href="#ref-4"' in event_7 and all(f'href="#ref-{n}"' not in event_7 for n in (21,22,23,26)), f"April 10 references misattributed: {lang}"
              assert all(f'href="#ref-{n}"' in event_13 for n in (21,22,23,26)), f"May 7 casualty references missing: {lang}"
              assert 'name="robots" content="noindex"' not in banyias
              for source_id in range(1, 27):
                  assert f'id="ref-{source_id}"' in banyias, f"Missing source {source_id}: {lang}"

              for route in ("/", "/projects/", "/publications/", "/blog/"):
                  html = page(lang, route).read_text(encoding="utf-8")
                  assert "application/ld+json" in html, f"Missing JSON-LD: {lang} {route}"
                  assert 'rel="canonical"' in html, f"Missing canonical: {lang} {route}"
                  assert f'hreflang="{lang}"' in html, f"Missing hreflang: {lang} {route}"
                  assert f'href="/{lang}/archive/"' in html, f"Archive not internally linked: {lang} {route}"

              featured = page(lang, "/blog/local-ai-agent-reliability/").read_text(encoding="utf-8")
              article_titles = {
                  "en": "Can We Trust a Local AI Assistant?",
                  "ar": "هل يمكن الوثوق بمساعد ذكاء اصطناعي محلي؟",
                  "fr": "Peut-on faire confiance à un assistant IA local ?"
              }
              assert article_titles[lang] in featured, f"Missing localized featured article: {lang}"
              assert "20.83" in featured or "20,83" in featured, f"Missing primary evaluation estimate: {lang}"
              assert "8,064" in featured or "8 064" in featured, f"Missing episode count: {lang}"
              assert "not been peer reviewed" in featured.lower() or "غير محكّمة" in featured or "non évaluée par les pairs" in featured.lower(), f"Missing preprint status: {lang}"
              article_urls = [
                  "https://doi.org/10.5281/zenodo.24488951",
                  "https://doi.org/10.5281/zenodo.24549236",
                  "https://deepmind.google/models/gemma/gemma-4/",
                  "https://ollama.com/library/gemma4:12b-it-qat",
                  "https://doi.org/10.6028/NIST.AI.600-1",
                  "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/",
                  "https://arxiv.org/abs/2210.03629",
                  "https://arxiv.org/abs/2303.11366",
                  "https://arxiv.org/abs/2308.03688",
                  "https://arxiv.org/abs/2406.12045",
                  "https://arxiv.org/abs/2406.13352"
              ]
              for url in article_urls:
                  assert url in featured, f"Missing featured article reference {url}: {lang}"
              article_graph = schemas(featured)
              article_node = next(x for x in article_graph if x.get("@type") == "BlogPosting")
              assert len(article_node.get("citation", [])) == 11, f"Expected 11 structured article citations: {lang}"
              assert article_node.get("datePublished") == "2026-11-27"
              assert article_node.get("image") == "https://kasemadra.com/assets/local-ai-agent-reliability-hero.webp"
              assert featured.count('property="og:image"') == 1
              toc_ids = set(re.findall(r'href="#(section-[0-9]+)"', featured))
              heading_ids = set(re.findall(r'id="(section-[0-9]+)"', featured))
              assert toc_ids and toc_ids == heading_ids, f"Broken featured article table of contents: {lang}"
              assert 'name="robots" content="noindex"' not in featured
              assert f'href="/{lang}/blog/local-ai-agent-reliability/"' in page(lang, "/blog/").read_text(encoding="utf-8")
              for route in ("/publications/aco-llm/", "/publications/aco-llm-results/"):
                  assert "local-ai-agent-reliability" in page(lang, route).read_text(encoding="utf-8"), f"Missing article cross-link: {lang} {route}"

          hero = root / "assets/local-ai-agent-reliability-hero.webp"
          assert hero.exists(), "Missing generated hero image"
          import hashlib
          hero_bytes = hero.read_bytes()
          assert hero_bytes[:4] == b"RIFF" and hero_bytes[8:12] == b"WEBP", "Hero image is not a valid WebP"
          assert hashlib.sha256(hero_bytes).hexdigest() == "02e985665e63a3988c01ddfbfb64f546134c958898962cd9a8d9462518e1929b", "Hero image hash mismatch"

          robots = (root / "robots.txt").read_text(encoding="utf-8")
          assert "Allow: /" in robots and "sitemap.xml" in robots
          sitemap = ET.parse(root / "sitemap.xml").getroot()
          urls = sitemap.findall("sm:url", ns)
          assert len(urls) == 40, f"Expected 40 sitemap URLs, found {len(urls)}"
          assert all(url.find("sm:loc", ns) is not None for url in urls)
          assert all(url.findall("xhtml:link", ns) for url in urls), "Missing hreflang alternates in sitemap"
          assert (root / "index.html").exists()
          print("PASS: root WebSite entity, Person graph, encyclopedic ProfilePage, featured article, 20-event Baniyas archive, 26 references, three languages, crawlable canonicals, hreflang and 40 sitemap URLs.")
          PY
      - name: Upload static review preview (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: kasem-adra-knowledge-archive-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
